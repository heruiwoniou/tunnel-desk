name: Setup TunnelDesk
description: Install Node 22, Rust stable, Linux build packages, and npm dependencies.
inputs:
  rust-target:
    description: Rust target triple to install with the stable toolchain.
    required: true
  rustfmt:
    description: Install rustfmt when true.
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version: 22
        cache: npm

    - name: Setup Rust with rustfmt
      if: inputs.rustfmt == 'true'
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ inputs.rust-target }}
        components: rustfmt

    - name: Setup Rust
      if: inputs.rustfmt != 'true'
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ inputs.rust-target }}

    - name: Cache Rust build outputs
      uses: swatinem/rust-cache@v2
      with:
        workspaces: ./src-tauri -> target

    - name: Install Linux packages
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
          build-essential \
          file \
          libayatana-appindicator3-dev \
          libsecret-1-dev \
          libssl-dev \
          libwebkit2gtk-4.1-dev \
          librsvg2-dev \
          patchelf

    - name: Install npm dependencies
      shell: bash
      run: npm ci
