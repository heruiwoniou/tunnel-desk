name: Verify TunnelDesk
description: Run actionlint, shellcheck, frontend checks, version checks, and Linux Rust tests.
inputs:
  rust-target:
    description: Host Rust target for the Linux checks job.
    required: true
runs:
  using: composite
  steps:
    - name: Setup toolchain
      uses: ./.github/actions/setup
      with:
        rust-target: ${{ inputs.rust-target }}
        rustfmt: "true"

    - name: Lint workflows
      shell: bash
      run: |
        set -euo pipefail
        curl -fsSL -o actionlint.tar.gz \
          https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
        echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz" | sha256sum -c -
        tar -xzf actionlint.tar.gz actionlint
        ./actionlint -color
        shellcheck scripts/publish-release.sh

    - name: Frontend and version checks
      shell: bash
      run: |
        set -euo pipefail
        npm run lint
        npm run typecheck
        npm test
        npm run version:check

    - name: Rust format and tests
      shell: bash
      working-directory: src-tauri
      run: |
        set -euo pipefail
        cargo fmt --all -- --check
        cargo test --locked
