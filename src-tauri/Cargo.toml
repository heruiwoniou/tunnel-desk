[package]
name = "tunneldesk"
version = "0.1.0"
description = "Desktop SSH local and remote port forwarding"
authors = ["Rui"]
edition = "2024"
rust-version = "1.90"

[lib]
name = "tunneldesk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "io-util", "sync", "time", "fs"] }
russh = "0.65"
keyring = { version = "4", features = ["v1"] }
zeroize = "1"
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
base64 = "0.22"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
glob = "0.3"
tokio-util = { version = "0.7", features = ["rt"] }
async-trait = "0.1"
dirs = "6"

[dev-dependencies]
tempfile = "3"
rand = { version = "0.10", features = ["thread_rng"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
